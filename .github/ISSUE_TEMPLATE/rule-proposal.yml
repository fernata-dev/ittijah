name: Rule proposal
description: Propose a new check.
labels: ["rule-proposal"]
body:
  - type: textarea
    id: bug
    attributes:
      label: The real-world rendering bug
      description: "No rule ships without a documented bug. What does the user see? Screenshot if possible."
    validations: { required: true }
  - type: textarea
    id: bad-good
    attributes: { label: BAD and GOOD code, render: text }
    validations: { required: true }
  - type: textarea
    id: fp
    attributes:
      {
        label: How could it produce false positives?,
        description: "And how would the rule stay silent in those cases?",
      }
