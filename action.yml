name: "Ittijah — RTL & bidi linter"
description: "Find RTL and bidirectional-text bugs (CSS, Tailwind, JSX, HTML, translations) and report them to GitHub code scanning."
author: "Ittijah contributors"
branding:
  icon: "arrow-left"
  color: "blue"

inputs:
  path:
    description: "Paths to scan (space separated)."
    default: "."
  args:
    description: "Extra CLI arguments, e.g. '--rule bidi-unsafe-string --max-warnings 0'."
    default: ""
  version:
    description: "ittijah npm version to run."
    default: "latest"
  upload-sarif:
    description: "Upload results to GitHub code scanning (needs `security-events: write`)."
    default: "true"
  fail-on-problems:
    description: "Fail the job when Ittijah exits with problems (exit code 1)."
    default: "true"

outputs:
  sarif-file:
    description: "Path of the generated SARIF report."
    value: ${{ steps.scan.outputs.sarif-file }}
  exit-code:
    description: "Ittijah exit code (0 = clean, 1 = problems, 2 = usage/config error)."
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"

    - id: scan
      shell: bash
      env:
        ITTIJAH_PATHS: ${{ inputs.path }}
        ITTIJAH_ARGS: ${{ inputs.args }}
        ITTIJAH_VERSION: ${{ inputs.version }}
      run: |
        set +e
        sarif="${RUNNER_TEMP}/ittijah.sarif"
        # pretty output in the log, SARIF for code scanning
        npx --yes "ittijah@${ITTIJAH_VERSION}" $ITTIJAH_PATHS $ITTIJAH_ARGS
        code=$?
        npx --yes "ittijah@${ITTIJAH_VERSION}" $ITTIJAH_PATHS $ITTIJAH_ARGS --format sarif --output "$sarif" >/dev/null 2>&1
        echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" = "2" ]; then exit 2; fi
        exit 0

    - if: ${{ inputs.upload-sarif == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: ittijah

    - if: ${{ inputs.fail-on-problems == 'true' && steps.scan.outputs.exit-code == '1' }}
      shell: bash
      run: |
        echo "::error::Ittijah found RTL / bidi problems. See the log above or the Security tab."
        exit 1
